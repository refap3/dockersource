services:
  calibre:
    image: lscr.io/linuxserver/calibre:latest
    container_name: calibre
    restart: unless-stopped
    ports:
      - 8091:8080   # web UI (http) — only usable behind a TLS reverse proxy
      - 8092:8181   # web UI (https) — full Calibre desktop in the browser; use this one
      - 8081:8081   # Calibre content server (browse/download/upload books)
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Vienna
    volumes:
      - calibre_config:/config

volumes:
  calibre_config:
