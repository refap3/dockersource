<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>netwatch</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header>
  <h1>netwatch</h1>
  <span class="subtitle">home network monitor</span>
  <div class="tabs">
    <button class="tab-btn active" data-tab="devices">Devices</button>
    <button class="tab-btn" data-tab="events">Events</button>
  </div>
</header>

<div class="toolbar">
  <button class="btn btn-primary" id="scan-btn">Scan Now</button>
  <button class="btn btn-secondary" id="check-btn">Check Status</button>
  <span class="status-count" id="device-count">—</span>
  <span class="refresh-info" id="last-refresh"></span>
  <div style="margin-left:auto;display:flex;gap:8px;align-items:center;">
    <button class="btn btn-secondary" id="export-btn">Export DB</button>
    <button class="btn btn-secondary" id="import-btn">Import DB</button>
    <input type="file" id="import-file" accept=".json" style="display:none">
  </div>
</div>

<main>

  <!-- Devices panel -->
  <div class="tab-panel active" id="panel-devices">
    <table>
      <thead>
        <tr>
          <th data-col="online">Status</th>
          <th data-col="name">Name / Hostname</th>
          <th data-col="mac">MAC</th>
          <th data-col="ip">IP</th>
          <th data-col="vendor">Vendor</th>
          <th data-col="category">Category</th>
          <th data-col="note">Note</th>
          <th data-col="first_seen">First Seen</th>
          <th data-col="last_seen">Last Seen</th>
          <th data-col="notify_online">Alerts</th>
        </tr>
      </thead>
      <tbody id="devices-tbody">
        <tr><td colspan="10" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

  <!-- Events panel -->
  <div class="tab-panel" id="panel-events">
    <div class="filter-bar">
      <select id="ev-filter-type" class="cat-select">
        <option value="">All event types</option>
        <option value="new_device">new device</option>
        <option value="came_online">came online</option>
        <option value="went_offline">went offline</option>
        <option value="ip_changed">ip changed</option>
      </select>
      <input id="ev-filter-mac" class="filter-input" type="text" placeholder="Filter by MAC…" spellcheck="false" />
      <button class="btn btn-sm" id="ev-filter-clear">Clear</button>
      <span class="filter-count" id="ev-filter-count"></span>
    </div>
    <table>
      <thead>
        <tr>
          <th data-col-ev="ts">Time</th>
          <th data-col-ev="mac">MAC</th>
          <th data-col-ev="event_type">Event</th>
          <th data-col-ev="detail">Detail</th>
        </tr>
      </thead>
      <tbody id="events-tbody">
        <tr><td colspan="4" class="empty">Loading…</td></tr>
      </tbody>
    </table>
  </div>

</main>

<script src="/static/app.js"></script>
</body>
</html>
