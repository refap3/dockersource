scanner:
  network: "192.168.1.0/24"
  interface: "eth0"
  interval_minutes: 5
  offline_threshold_minutes: 15

notifications:
  webhook:
    enabled: false
    url: "https://ntfy.sh/my-homelab-topic"
    method: POST
    headers: {}

  telegram:
    enabled: false
    bot_token: ""
    chat_id: ""

  smtp:
    enabled: false
    host: "smtp.gmail.com"
    port: 587
    username: ""
    password: ""
    from_addr: "netwatch@home"
    to_addr: "admin@home"

alarms:
  new_device: true
  known_device_online: true
  known_device_offline: false

# Static device definitions — merged with DB on startup.
# These override auto-detected values and are never overwritten by scanning.
# known_devices:
#   "aa:bb:cc:dd:ee:ff":
#     name: "Synology NAS"
#     category: "nas"
#     notify_offline: true
#   "11:22:33:44:55:66":
#     name: "Router"
#     category: "router"
#     notify_online: false
#     notify_offline: true
known_devices: {}
